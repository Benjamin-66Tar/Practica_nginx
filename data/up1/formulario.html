<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Solicitud</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 440px;
            border: 1px solid #334155;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            margin-bottom: 0.75rem;
        }

        h1 {
            color: #38bdf8;
            font-size: 1.6rem;
            font-weight: 700;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 0.4rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1px solid #475569;
            border-radius: 8px;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        input::placeholder {
            color: #64748b;
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .footer-note {
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="badge">Registro</span>
            <h1>Formulario de Solicitud</h1>
            <p class="subtitle">Por favor completa los siguientes datos</p>
        </div>

        <form action="http://localhost:5000/api/registro" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre" 
                    placeholder="Ej. Juan Pérez" 
                    required 
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="edad">Edad</label>
                <input 
                    type="number" 
                    id="edad" 
                    name="edad" 
                    min="1" 
                    max="120" 
                    placeholder="Ej. 25" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="ejemplo@correo.com" 
                    required 
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    minlength="6" 
                    placeholder="Mínimo 6 caracteres" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="btn-submit">Enviar Solicitud</button>
        </form>

        <p class="footer-note">Tus datos están protegidos y serán tratados de forma confidencial.</p>
    </div>
</body>
</html>
